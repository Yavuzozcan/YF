<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#08111f">

  <title>YF — Yavuz Finans</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="top-header">

      <div class="brand-area">
        <div class="logo">YF</div>

        <div>
          <span class="brand-subtitle">Yavuz Finans</span>
          <h1 id="welcomeText">Günaydın Yavuz 👋</h1>
        </div>
      </div>

      <button class="profile-button" type="button">
        Y
      </button>

    </header>


    <section class="balance-card">

      <div class="balance-top">

        <div>
          <span class="card-label">Net Durum</span>
          <strong id="netBalance">₺0,00</strong>
        </div>

        <span class="status-badge">
          Güncel
        </span>

      </div>

      <div class="balance-footer">

        <span>
          Tüm varlıklar ve borçlar
        </span>

        <span id="balanceStatus">
          Dengeli
        </span>

      </div>

    </section>


    <section class="summary-grid">

      <article class="summary-card debt-card">

        <div class="summary-icon">
          💳
        </div>

        <span>Toplam Borç</span>

        <strong id="totalDebt">
          ₺0,00
        </strong>

      </article>


      <article class="summary-card asset-card">

        <div class="summary-icon">
          💰
        </div>

        <span>Toplam Varlık</span>

        <strong id="totalAssets">
          ₺0,00
        </strong>

      </article>


      <article class="summary-card payment-card">

        <div class="summary-icon">
          ✓
        </div>

        <span>Bu Ay Ödenen</span>

        <strong id="monthlyPayment">
          ₺0,00
        </strong>

      </article>


      <article class="summary-card card-count-card">

        <div class="summary-icon">
          ▣
        </div>

        <span>Kart Sayısı</span>

        <strong id="cardCount">
          0
        </strong>

      </article>

    </section>


    <section class="section-block">

      <div class="section-header">

        <div>
          <span class="section-subtitle">
            Ödeme Takibi
          </span>

          <h2>
            Yaklaşan Ödemeler
          </h2>
        </div>

        <button class="text-button" type="button">
          Tümünü Gör
        </button>

      </div>


      <div class="payment-list">

        <article class="payment-item">

          <div class="bank-icon
